name: Release

on:
  workflow_dispatch:
    inputs:
      release-type:
        description: 'Release type (auto = derive from conventional commits, alpha = pre-release)'
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
          - alpha
        default: alpha
      reuse-build-run-id:
        description: 'Skip the tgfx builds and reuse the artifacts of this earlier run id (kept 3 days)'
        type: string
        default: ''

defaults:
  run:
    shell: bash

jobs:
  build-tgfx:
    name: Build tgfx (${{ matrix.platform }})
    if: inputs.reuse-build-run-id == ''
    runs-on: macos-15
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: ios
            libs: packages/react-native-tgfx/ios/libs
          - platform: android
            libs: |
              packages/react-native-tgfx/android/libs
              packages/react-native-tgfx/android/libs-vulkan
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false


      - name: Verify the tgfx submodule is populated
        run: |
          if [ ! -f packages/react-native-tgfx/cpp/third_party/tgfx/CMakeLists.txt ]; then
            echo "::error::tgfx submodule is empty"
            exit 1
          fi

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      # The tgfx fork has no LFS objects; Tencent/tgfx serves the same OIDs anonymously.
      - name: Point LFS at upstream tgfx
        working-directory: packages/react-native-tgfx/cpp/third_party/tgfx
        run: git config lfs.url https://github.com/Tencent/tgfx.git/info/lfs

      - name: Fetch tgfx third-party dependencies
        working-directory: packages/react-native-tgfx/cpp/third_party/tgfx
        run: ./install_tools.sh && ./sync_deps.sh

      # NDK 29's clang rejects tgfx's vendored highway, so pin RN's NDK.
      - name: Install Android NDK 27.1.12297006
        if: matrix.platform == 'android'
        run: |
          (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.1.12297006" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.1.12297006" >> "$GITHUB_ENV"
          # The NDK's yasm is x86_64-only; without Rosetta the x86 ABIs' libjpeg-turbo build dies on it.
          NDK_YASM="$ANDROID_HOME/ndk/27.1.12297006/toolchains/llvm/prebuilt/darwin-x86_64/bin/yasm"
          if ! "$NDK_YASM" --version > /dev/null 2>&1; then
            printf '#!/bin/sh\nexec %s "$@"\n' "$(command -v yasm)" > "$NDK_YASM"
          fi

      - name: Build tgfx
        run: bash packages/react-native-tgfx/scripts/build-tgfx-${{ matrix.platform }}.sh

      - uses: actions/upload-artifact@v4
        with:
          name: tgfx-${{ matrix.platform }}
          path: ${{ matrix.libs }}
          if-no-files-found: error
          retention-days: 3

  release:
    name: Publish to npm (OIDC) and create GitHub release
    needs: build-tgfx
    if: ${{ !cancelled() && (needs.build-tgfx.result == 'success' || needs.build-tgfx.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      actions: read
    steps:
      # Full history for the changelog; GITHUB_TOKEN stays persisted for release-it's push.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: actions/download-artifact@v4
        with:
          name: tgfx-ios
          run-id: ${{ inputs.reuse-build-run-id || github.run_id }}
          github-token: ${{ github.token }}
          path: packages/react-native-tgfx/ios/libs

      - uses: actions/download-artifact@v4
        with:
          name: tgfx-android
          run-id: ${{ inputs.reuse-build-run-id || github.run_id }}
          github-token: ${{ github.token }}
          path: packages/react-native-tgfx/android

      - name: Verify the prebuilt tgfx libraries
        working-directory: packages/react-native-tgfx
        run: |
          missing=0
          for lib in \
            ios/libs/libtgfx.xcframework/Info.plist \
            ios/libs/libtgfx.xcframework/{ios-arm64,ios-arm64_x86_64-simulator}/libtgfx-ios.a \
            android/libs/{armeabi-v7a,arm64-v8a,x86,x86_64}/libtgfx.a \
            android/libs-vulkan/{armeabi-v7a,arm64-v8a,x86,x86_64}/libtgfx.a; do
            if [ -f "$lib" ]; then ls -lh "$lib"; else echo "::error::$lib missing"; missing=1; fi
          done
          exit $missing

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Update npm (trusted publishing needs npm >= 11.5.1)
        run: npm install -g npm@11

      - uses: oven-sh/setup-bun@v2

      - name: Install npm dependencies (bun)
        run: bun install --frozen-lockfile

      - name: Configure Git
        run: |
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"

      - name: Determine release version
        id: version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TYPE: ${{ github.event.inputs.release-type }}
        run: |
          ARGS=""
          if [[ "$RELEASE_TYPE" == "alpha" ]]; then
            ARGS="--preRelease=alpha"
          elif [[ "$RELEASE_TYPE" != "auto" ]]; then
            ARGS="$RELEASE_TYPE"
          fi
          # Resolve the version once at the root so every package and the root release-it agree.
          VERSION=$(./node_modules/.bin/release-it --release-version --ci $ARGS | tail -n1)
          echo "Releasing $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # The increment is already baked into VERSION; only the pre-release flag (npm dist-tag) carries over.
          [[ "$RELEASE_TYPE" == "alpha" ]] && echo "args=$ARGS" >> "$GITHUB_OUTPUT" || true

      - name: Release ${{ steps.version.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run release ${{ steps.version.outputs.version }} ${{ steps.version.outputs.args }} --ci
